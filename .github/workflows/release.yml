# .github/workflows/release.yml
#
# TWO ways to trigger:
#
#  A) Push a tag from terminal:
#       git tag v1.2.3 && git push origin v1.2.3
#
#  B) GitHub UI → Actions → Build & Release Textiva → Run workflow
#       → type  1.2.3  in the version box → Run workflow

name: Build & Release Textiva

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 — no leading v)"
        required: true
        default: "1.0.0"
        type: string

      prerelease:
        description: "Mark as pre-release?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      draft:
        description: "Save as draft instead of publishing?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      create_tag:
        description: "Create & push the git tag automatically?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Textiva installer & publish release
    runs-on: windows-latest

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1.  Checkout
      # ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────
      # 2.  Resolve version + tag
      # ────────────────────────────────────────────────────────────────
      - name: Resolve version and tag name
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
            RAW="v${VER}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
            VER="${RAW#v}"
          fi

          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────"
          echo "  App     : Textiva"
          echo "  Trigger : ${{ github.event_name }}"
          echo "  Tag     : $RAW"
          echo "  Version : $VER"
          echo "──────────────────────────────────"

      # ────────────────────────────────────────────────────────────────
      # 3.  (Manual only) Create + push git tag
      # ────────────────────────────────────────────────────────────────
      - name: Create and push git tag
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create_tag == 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.raw }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "⚠️  Tag $TAG already exists — skipping"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "✅ Created and pushed tag $TAG"
          fi

      # ────────────────────────────────────────────────────────────────
      # 4.  Write version.txt
      # ────────────────────────────────────────────────────────────────
      - name: Write version.txt
        shell: bash
        run: |
          echo "${{ steps.version.outputs.ver }}" > version.txt
          echo "version.txt → $(cat version.txt)"

      # ────────────────────────────────────────────────────────────────
      # 5.  Set up Python
      # ────────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # ────────────────────────────────────────────────────────────────
      # 6.  Install dependencies
      # ────────────────────────────────────────────────────────────────
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ────────────────────────────────────────────────────────────────
      # 7.  Build Textiva.exe with PyInstaller
      # ────────────────────────────────────────────────────────────────
      - name: Build Textiva.exe with PyInstaller
        shell: bash
        run: pyinstaller textiva.spec

      - name: Verify Textiva.exe was produced
        shell: bash
        run: |
          ls -lh dist/Textiva.exe
          echo "✅ Textiva.exe ready"

      # ────────────────────────────────────────────────────────────────
      # 8.  Install Inno Setup 6
      # ────────────────────────────────────────────────────────────────
      - name: Install Inno Setup 6
        shell: powershell
        run: |
          $url  = "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe"
          $dest = "$env:RUNNER_TEMP\innosetup.exe"

          Write-Host "Downloading Inno Setup..."
          $wc = New-Object System.Net.WebClient
          $wc.DownloadFile($url, $dest)

          # Verify valid PE executable (magic bytes: MZ)
          $bytes = [System.IO.File]::ReadAllBytes($dest)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "❌ Downloaded file is not a valid executable"
            exit 1
          }

          $sizeMB = [math]::Round((Get-Item $dest).Length / 1MB, 2)
          Write-Host "✅ Downloaded $sizeMB MB — file is valid"

          Write-Host "Installing Inno Setup silently..."
          $proc = Start-Process `
            -FilePath $dest `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" `
            -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "❌ Installer exited with code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

          $isccPath = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path "$isccPath\ISCC.exe")) {
            Write-Error "❌ ISCC.exe not found after install"
            exit 1
          }

          Write-Host "✅ ISCC.exe ready at $isccPath"
          Add-Content -Path $env:GITHUB_PATH -Value $isccPath

      # ────────────────────────────────────────────────────────────────
      # 9.  Build Textiva Windows installer
      # ────────────────────────────────────────────────────────────────
      - name: Create installer output directory
        shell: bash
        run: mkdir -p installer/output

      - name: Build Textiva installer with Inno Setup
        shell: powershell
        run: |
          $ver  = "${{ steps.version.outputs.ver }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          Write-Host "Building Textiva installer for version $ver ..."
          & $iscc /DMyAppVersion=$ver installer\textiva.iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Inno Setup build failed (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }

      - name: Verify Textiva installer was produced
        shell: bash
        run: |
          ls -lh installer/output/
          echo "✅ Textiva installer ready"

      # ────────────────────────────────────────────────────────────────
      # 10.  Generate changelog
      # ────────────────────────────────────────────────────────────────
      - name: Generate changelog
        shell: bash
        run: |
          RAW="${{ steps.version.outputs.raw }}"
          VER="${{ steps.version.outputs.ver }}"

          PREV=$(git tag --sort=-creatordate \
                 | grep -v "^${RAW}$" \
                 | head -n 1 || echo "")

          if [ -z "$PREV" ]; then
            RANGE="HEAD"
            HEADER="## 🎉 Initial Release — Textiva ${VER}"
          else
            RANGE="${PREV}..HEAD"
            HEADER="## 📋 What changed since ${PREV}"
          fi

          {
            echo "$HEADER"
            echo ""

            FEAT=$(git log $RANGE  --pretty=format:"%s (%h)" --no-merges \
                   | grep -i "^feat"      | sed 's/^/- /' || true)
            FIX=$(git log $RANGE   --pretty=format:"%s (%h)" --no-merges \
                   | grep -i "^fix"       | sed 's/^/- /' || true)
            CHORE=$(git log $RANGE --pretty=format:"%s (%h)" --no-merges \
                   | grep -iEv "^feat|^fix" | sed 's/^/- /' || true)

            [ -n "$FEAT"  ] && echo "### ✨ New Features"  && echo "$FEAT"  && echo ""
            [ -n "$FIX"   ] && echo "### 🐛 Bug Fixes"     && echo "$FIX"   && echo ""
            [ -n "$CHORE" ] && echo "### 🔧 Other Changes" && echo "$CHORE" && echo ""

            echo "---"
            echo ""
            echo "### 📦 Downloads"
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`Textiva-Setup-${VER}.exe\` | Windows installer — **recommended** |"
            echo "| \`Textiva.exe\`              | Portable exe — no install needed    |"
            echo ""

            if [ -n "$PREV" ]; then
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${PREV}...${RAW}"
            fi
          } > CHANGELOG_RELEASE.md

          echo "── Changelog preview ──"
          cat CHANGELOG_RELEASE.md

      # ────────────────────────────────────────────────────────────────
      # 11.  Resolve draft / prerelease flags
      # ────────────────────────────────────────────────────────────────
      - name: Resolve release flags
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "draft=${{ github.event.inputs.draft }}"           >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "draft=false"      >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ────────────────────────────────────────────────────────────────
      # 12.  Publish GitHub Release
      # ────────────────────────────────────────────────────────────────
      - name: Publish Textiva GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:                ${{ steps.version.outputs.raw }}
          name:                    "Textiva ${{ steps.version.outputs.ver }}"
          body_path:               CHANGELOG_RELEASE.md
          draft:                   ${{ steps.flags.outputs.draft }}
          prerelease:              ${{ steps.flags.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/Textiva.exe
            installer/output/Textiva-Setup-${{ steps.version.outputs.ver }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────
      # 13.  Job summary
      # ────────────────────────────────────────────────────────────────
      - name: Write job summary
        shell: bash
        run: |
          VER="${{ steps.version.outputs.ver }}"
          RAW="${{ steps.version.outputs.raw }}"
          REPO="${{ github.repository }}"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ✅ Textiva ${VER} released successfully

          | | |
          |---|---|
          | **App**         | Textiva |
          | **Version**     | \`${VER}\` |
          | **Tag**         | \`${RAW}\` |
          | **Trigger**     | \`${{ github.event_name }}\` |
          | **Draft**       | \`${{ steps.flags.outputs.draft }}\` |
          | **Pre-release** | \`${{ steps.flags.outputs.prerelease }}\` |

          ### 📦 Artifacts
          - [\`Textiva-Setup-${VER}.exe\`](https://github.com/${REPO}/releases/tag/${RAW}) — Windows installer
          - [\`Textiva.exe\`](https://github.com/${REPO}/releases/tag/${RAW}) — Portable exe

          ### 🔗 Release page
          https://github.com/${REPO}/releases/tag/${RAW}
          EOF